name: "Diagnóstico: hallar endpoint de secrets Render API"

on:
  workflow_dispatch:

env:
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

jobs:
  spec:
    runs-on: ubuntu-22.04
    steps:
      - name: Fetch OpenAPI + find secret/service paths+schemas
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -s https://api-docs.render.com/openapi/render-public-api-1.json -o /tmp/spec.json
          echo "=== paths containing 'secret' or 'service' ==="
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/spec.json'))
          paths=d.get('paths',{})
          for p in sorted(paths):
              if 'secret' in p.lower() or 'service' in p.lower():
                  methods=list(paths[p].keys())
                  print(p, methods)
          print("=== ALL paths ===")
          for p in sorted(paths): print(p, list(paths[p].keys()))
          print("=== schemas containing Secret ===")
          schemas=d.get('components',{}).get('schemas',{})
          for s in sorted(schemas):
              if 'ecret' in s: print(s, list(schemas[s].keys()) if isinstance(schemas[s],dict) else schemas[s])
          PY
