name: "Reproducción: imagen Docker + 512MiB (plan free) + NODE_ENV=production"

on:
  workflow_dispatch:

jobs:
  docker-repro:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: nutrifit
          POSTGRES_DB: nutrifit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen Docker exacta
        run: |
          docker build -f backend/Dockerfile -t nutrifit-render-repro backend/ 2>&1 | tail -15
      - name: Arrancar con límite 512MiB (simula plan free)
        env:
          DATABASE_URL: postgresql://postgres:nutrifit@localhost:5432/nutrifit?schema=public
        run: |
          # db push en background antes (no afecta al test de arranque)
          docker run --rm -d \
            --name nr \
            --memory=512m --memory-swap=512m --cpus=1 \
            -e DATABASE_URL="postgresql://postgres:nutrifit@localhost:5432/nutrifit?schema=public" \
            -e JWT_SECRET=test-secret-123456 \
            -e CORS_ORIGINS=http://localhost:3000 \
            -e PORT=3001 \
            -e NODE_ENV=production \
            nutrifit-render-repro
          echo "container arrancado"
      - name: Esperar health (con TIMEOUT 120s)
        run: |
          up=0
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/docs || true)
            echo "poll $i /api/docs -> $code"
            if [ "$code" = "200" ]; then up=1; break; fi
            sleep 5
          done
          echo "UP=$up"
      - name: Capturar estado y logs del contenedor
        if: always()
        run: |
          echo "=== docker inspect OOMKilled / exit ==="
          docker inspect --format='OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} Status={{.State.Status}}' nr 2>&1 || true
          echo "=== docker logs nr ==="
          docker logs nr 2>&1 | tail -60 || true
          docker stop -t 1 nr 2>/dev/null || true
