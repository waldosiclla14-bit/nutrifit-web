name: "Reproducción: build 1x, probar 512MiB vs 1024MiB (logs de Nest)"

on:
  workflow_dispatch:

jobs:
  docker-repro:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: nutrifit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen Docker exacta
        run: |
          docker build -f backend/Dockerfile -t nutrifit-render-repro backend/ 2>&1 | tail -8
      - name: Probar múltiples topes de memoria
        env:
          DATABASE_URL: postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/nutrifit?schema=public
        run: |
          for LIMIT in 512m 1024m; do
            echo "########## LIMIT=$LIMIT ##########"
            docker run -d --name nr \
              --network=host \
              --memory=$LIMIT --memory-swap=$LIMIT --cpus=1 \
              -e DATABASE_URL="postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/nutrifit?schema=public" \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e CORS_ORIGINS=http://localhost:3000 \
              -e PORT=3001 -e NODE_ENV=production \
              nutrifit-render-repro
            sleep 3
            if [ ! "$(docker ps -q -f name=nr)" ]; then echo "CONTENEDOR SALIO (no sirve)"; fi
            for i in $(seq 1 14); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/docs || true)
              echo "poll $i /api/docs -> $code"
              if [ "$code" = "200" ]; then echo "BOOTED 200"; break; fi
              [ -z "$(docker ps -q -f name=nr)" ] && { echo "container gone"; break; }
              sleep 5
            done
            echo "--- inspect ---"
            docker inspect --format='Running={{.State.Running}} OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}' nr 2>&1 || true
            echo "--- logs (tail 40) ---"
            docker logs nr 2>&1 | tail -40 || true
            docker rm -f nr 2>/dev/null || true
            echo ""
          done
