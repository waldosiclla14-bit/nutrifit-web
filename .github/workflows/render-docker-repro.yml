name: "Reproducción: imagen Docker + 512MiB + captura OOM"

on:
  workflow_dispatch:

jobs:
  docker-repro:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: nutrifit
          POSTGRES_DB: nutrifit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen Docker exacta
        run: |
          docker build -f backend/Dockerfile -t nutrifit-render-repro backend/ 2>&1 | tail -8
      - name: Arrancar con 512MiB (plan free)
        run: |
          docker run -d \
            --name nr \
            --memory=512m --memory-swap=512m --cpus=1 \
            -e DATABASE_URL="postgresql://postgres:nutrifit@localhost:5432/nutrifit?schema=public" \
            -e JWT_SECRET=test-secret-123456 \
            -e CORS_ORIGINS=http://localhost:3000 \
            -e PORT=3001 \
            -e NODE_ENV=production \
            nutrifit-render-repro
          echo "container arrancado"
      - name: Health check + detección de salida
        run: |
          for i in $(seq 1 20); do
            if [ ! "$(docker ps -q -f name=nr)" ]; then echo "CONTENEDOR FINALIZADO antes de tiempo"; break; fi
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/docs || true)
            echo "poll $i /api/docs -> $code"
            if [ "$code" = "200" ]; then echo "BOOTED"; break; fi
            sleep 5
          done
      - name: Capturar estado + logs (OOM?)
        if: always()
        run: |
          echo "=== docker inspect ==="
          docker inspect --format='Exists={{.State.Running}} OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} Status={{.State.Status}}' nr 2>&1 || true
          echo "=== docker wait (codigo salida) ==="
          docker wait nr 2>&1 || true
          echo "=== docker logs nr (stdout/stderr) ==="
          docker logs nr 2>&1 | tail -50 || true
          docker rm -f nr 2>/dev/null || true
