name: "Diagnostic: Probar endpoints de logs de Render"

on:
  workflow_dispatch:
    inputs:
      deploy_id:
        description: 'deploy id (dep-xxxx)'
        required: false
        default: 'dep-d9tr5pugekts73997c7g'

env:
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probar endpoints de logs
        run: |
          id="${{ inputs.deploy_id }}"
          sid="${RENDER_SERVICE_ID}"
          hdr=( -s -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" )
          for ep in \
            "/v1/services/${sid}/logs?limit=200" \
            "/v1/services/${sid}/deploys/${id}/logs" \
            "/v1/services/${sid}/deploys/${id}/build/logs" \
            "/v1/services/${sid}/builds?limit=10" \
            "/v1/services/${sid}/deploys/${id}" ; do
            code=$(curl "${hdr[@]}" -o /tmp/body.txt -w "%{http_code}" "https://api.render.com${ep}")
            echo "### GET $ep -> HTTP $code"
            head -c 1200 /tmp/body.txt
            echo ""
          done
