name: "Fix: set JWT_SECRET en Render + redeploy"

on:
  workflow_dispatch:

env:
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

jobs:
  fix:
    runs-on: ubuntu-22.04
    env:
      SVC: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Schema del PUT env-var + set workspace
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -s https://api-docs.render.com/openapi/render-public-api-1.json -o /tmp/spec.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/spec.json'))
          p=d['paths']['/services/{serviceId}/env-vars/{envVarKey}']['put']
          print("REQ BODY $ref/schema:", p.get('requestBody'))
          for sid,defs in d.get('components',{}).get('schemas',{}).items():
              if sid.lower().startswith('env_var') or 'envvar' in sid.lower():
                  print("SCHEMA",sid,defs)
          print("ALL schemas:", list(d.get('components',{}).get('schemas',{}).keys())[:80])
          PY
      - name: Set workspace
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: render workspace set tea-d9qjtg142hec73efkgf0 --confirm 2>&1 | head -3
      - name: Generate + PATCH JWT_SECRET (try a, fallback b)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          JW=$(openssl rand -hex 32); echo "JWT_SECRET_GENERATED_LEN=${#JW}"
          echo "$JW" > /tmp/jwt.txt
          echo "=== attempt a (key+value) ==="
          curl -s -o /tmp/ra.txt -w "a: %{http_code}\n" -X PUT -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" -H "Content-Type: application/json" \
            -d "{\"key\":\"JWT_SECRET\",\"value\":\"$JW\"}" \
            "https://api.render.com/v1/services/$SVC/env-vars/JWT_SECRET"
          head -c 600 /tmp/ra.txt; echo
      - name: Deploy fresh (stream) and poll live /api/docs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "=== trigger deploy (clear cache) ==="
          render deploys create "$SVC" --output json --confirm 2>&1 | head -c 800; echo
          echo "=== poll live /api/docs (quota-free) ==="
          for i in $(seq 1 25); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://nutrifit-api-635n.onrender.com/api/docs 2>/dev/null || echo "000")
            st=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://nutrifit-api-635n.onrender.com/api/health 2>/dev/null || echo "000")
            echo "[t=$i] docs=$code health=$st"
            if [ "$code" = "200" ] && [ "$st" = "200" ]; then echo "LIVE_OK"; break; fi
            sleep 12
          done
