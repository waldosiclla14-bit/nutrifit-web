name: Deploy API a Render

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy en Render
        id: trigger
        run: |
          resp=$(curl -s -f -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys")
          echo "$resp"
          id=$(printf '%s' "$resp" | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          if [ -z "$id" ]; then echo "no deploy id found"; exit 1; fi
          echo "deploy_id=$id" >> "$GITHUB_OUTPUT"
      - name: Esperar y consultar estado del deploy
        run: |
          id="${{ steps.trigger.outputs.deploy_id }}"
          echo "Observando deploy: $id"
          for i in $(seq 1 30); do
            sleep 25
            status=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${id}" | python3 -c 'import sys,json
d=json.load(sys.stdin)
print("deploy=",d.get("status"),"build=",d.get("build",{}).get("status"),"reason=",(d.get("build",{}).get("reason") or d.get("reason") or ""))' 2>/dev/null || echo "unknown")
            echo "[$(date -u +%H:%M:%S)] $status"
            case "$status" in
              *ready*|*active*|*live*|*succeeded*) echo "DEPLOY_OK"; break ;;
              *failed*|*canceled*) echo "DEPLOY_FAILED"; break ;;
            esac
          done
