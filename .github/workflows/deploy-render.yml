name: Deploy API a Render

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      deploy_id:
        description: 'Deploy id a Render a monitorear/loggear (dep-xxxx). Vacío = crear uno nuevo.'
        required: false
        default: ''

env:
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolver / Disparar deploy en Render
        id: deploy
        run: |
          if [ -n "${{ inputs.deploy_id }}" ]; then
            echo "Usando deploy existente: ${{ inputs.deploy_id }}"
            echo "deploy_id=${{ inputs.deploy_id }}" >> "$GITHUB_OUTPUT"
          else
            resp=$(curl -s -f -X POST -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" -H "Content-Type: application/json" -d '{"clearCache":"do_not_clear"}' "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys")
            echo "RESP: $resp"
            id=$(printf '%s' "$resp" | grep -oE '"id":"dep-[A-Za-z0-9_-]+"' | grep -oE 'dep-[A-Za-z0-9_-]+')
            if [ -z "$id" ]; then echo "::error::no deploy id found"; exit 1; fi
            echo "deploy_id=$id" >> "$GITHUB_OUTPUT"
          fi
      - name: Esperar y consultar estado del deploy
        run: |
          set +e
          id="${{ steps.deploy.outputs.deploy_id }}"
          echo "Observando deploy: $id"
          for i in $(seq 1 12); do
            sleep 20
            raw=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${id}")
            deploy_status=$(printf '%s' "$raw" | sed -n 's/.*"status":"\([a-z_]*\)".*/\1/p' | head -1)
            echo "[$(date -u +%H:%M:%S)] deploy=$deploy_status"
            case "$deploy_status" in
              ready|active|live|succeeded|deployed) echo "DEPLOY_OK"; break ;;
              failed|canceled|update_failed|build_failed) echo "DEPLOY_FAILED"; break ;;
            esac
          done
      - name: Traer logs del deploy
        run: |
          id="${{ steps.deploy.outputs.deploy_id }}"
          echo "=== DEPLOY OBJECT ==="
          curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${id}"
          echo ""
          echo "=== DEPLOY LOGS /deploys/{id}/logs ==="
          curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${id}/logs"
          echo ""
          echo "=== DEPLOY LOGS /deploys/{id}/build/logs ==="
          curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${id}/build/logs"
          echo ""
          echo "=== SERVICE LOGS (recientes) ==="
          curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/logs?limit=200"
