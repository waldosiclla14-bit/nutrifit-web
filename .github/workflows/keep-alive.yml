name: Keep API alive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm up DB connection (prevent Neon free-tier pause)
        run: |
          curl -fsS --max-time 30 "https://nutrifit-api-635n.onrender.com/api/ping" || echo "ping failed"
