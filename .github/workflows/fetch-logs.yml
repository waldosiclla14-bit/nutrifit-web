name: Fetch Render logs
on:
  workflow_dispatch:
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Verify service + fetch logs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "=== service check ==="
          curl -s -o /dev/null -w "service HTTP %{http_code}\n" -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/$RENDER_SERVICE_ID"
          echo "=== web logs ==="
          curl -s -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/$RENDER_SERVICE_ID/logs?logType=web&numLines=250" | head -c 14000
