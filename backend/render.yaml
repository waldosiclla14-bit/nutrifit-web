services:
  - type: web
    name: nutrifit-api
    runtime: docker
    repo: https://github.com/waldosiclla14-bit/nutrifit-web
    rootDir: backend
    healthCheckPath: /api/products
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: https://nutrifit-web-nu.vercel.app
      - key: ADMIN_PASSWORD
        value: admin-change-me-2026
      - key: SELLER_PASSWORD
        value: seller-change-me-2026
      - key: PORT
        value: 3001
